<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: black;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input {
            padding: 10px;
            width: 65%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 14px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .addBtn {
            background-color: royalblue;
            color: white;
        }

        .doneBtn {
            background-color: green;
            color: white;
        }

        .deleteBtn {
            background-color: crimson;
            color: white;
        }

        li {
            margin-bottom: 15px;
            background-color: #eee;
            padding: 10px;
            border-radius: 6px;
        }

        .dark {
            background-color: #111;
            color: white;
        }

        .dark .container {
            background-color: #222;
        }

        .dark li {
            background-color: #333;
        }

        .themeBtn {
            background-color: black;
            color: white;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <button class="themeBtn" onclick="toggleTheme()">Toggle Theme</button>

        <h1>My To-Do List</h1>
        <p>Practice project using DOM manipulation</p>

        <input type="text" id="inputBox" placeholder="Enter your task">
        <button class="addBtn" onclick="showValue()">Add</button>

        <ul></ul>
    </div>

    <script>
        let input = document.querySelector("#inputBox");
        let ul = document.querySelector("ul");

        function showValue() {
            if (input.value.trim() === "") {
                alert("Please enter something");
                return;
            }

            let li = document.createElement("li");
            let doneBtn = document.createElement("button");
            let deleteBtn = document.createElement("button");

            li.innerText = input.value + " ";

            doneBtn.innerText = "Done";
            deleteBtn.innerText = "Delete";

            doneBtn.classList.add("doneBtn");
            deleteBtn.classList.add("deleteBtn");

            doneBtn.addEventListener("click", function () {
                li.style.textDecoration = "line-through";
            });

            deleteBtn.addEventListener("click", function () {
                li.remove();
            });

            li.append(doneBtn);
            li.append(deleteBtn);
            ul.append(li);

            input.value = "";
        }

        input.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                showValue();
            }
        });

        function toggleTheme() {
            document.body.classList.toggle("dark");
        }
    </script>

</body>

</html>
