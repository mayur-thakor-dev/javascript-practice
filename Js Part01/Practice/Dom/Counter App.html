<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>
        <ul>Counter App</ul>
    </h1>
    <h2 id="count">0</h2>
    <button onclick="inc()">+</button>
    <button onclick="dec()">-</button>

    <script>
        let h2 = document.querySelector("#count");
        function inc() {
            h2.innerText++;
        }

        function dec() {
            if(h2.innerText <= 0){
                alert("You can not decrement count less than zero");
                return;
            }
            h2.innerText--;
        }
    </script>
</body>

</html>
